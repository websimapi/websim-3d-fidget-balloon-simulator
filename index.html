<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fidget Balloon Simulator</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Import map for ES modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.158.0",
            "three/examples/jsm/": "https://esm.sh/three@0.158.0/examples/jsm/",
            "@mediapipe/hands": "https://esm.sh/@mediapipe/hands@0.4.1646424915",
            "@mediapipe/camera_utils": "https://esm.sh/@mediapipe/camera_utils@0.3.1640029074"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <div id="loading" class="loading">
            <div class="loader"></div>
            <p>Initializing hand tracking...</p>
        </div>
        
        <div id="controls" class="controls">
            <button id="startBtn" class="start-btn">Start Experience</button>
            <div class="instructions">
                <p>🖐️ Show your hand to the camera</p>
                <p>✊ Squeeze to deform the balloon</p>
                <p>📱 Feel the vibration feedback</p>
            </div>
        </div>
        
        <div id="canvas-container">
            <canvas id="three-canvas"></canvas>
            <video id="camera-feed" autoplay muted playsinline></video>
        </div>
        
        <div id="debug-info" class="debug-info">
            <div>Hand Detected: <span id="hand-status">No</span></div>
            <div>Squeeze Level: <span id="squeeze-level">0%</span></div>
            <div>Vibration: <span id="vibration-status">Off</span></div>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
